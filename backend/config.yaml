# Backend configuration for WhisperLiveKit server.

server:
  host: "127.0.0.1"
  port: 8765

stt:
  model: "medium" # tiny, base, small, medium, large-v3
  model_cache_dir: "" # optional; leave empty to use the default cache directory
  language: "auto" # auto, en, ja, zh
  backend_policy: "localagreement"
  backend: "auto" # auto, faster-whisper, whisper, openai-api
  min_chunk_size: 0.1
  buffer_trimming: "segment"
  buffer_trimming_sec: 15
  confidence_validation: false
  pcm_input: false # false = webm/opus via MediaRecorder
  vad: true
  vac: true
  vac_chunk_size: 0.04
  stall_timeout_sec: 15
  stall_check_interval_sec: 5
  engine_recycle_sec: 0 # rebuild STT engine periodically to release memory (0 disables)
  memory_cleanup_interval_sec: 60 # run gc/empty_cache periodically (0 disables)
  gpu_log_interval_sec: 0 # log CUDA memory stats every N seconds (0 disables)
translation:
  engine: "noop" # Desktop fallback; choose a local model or API service in the extension.
  target_language: "zh-TW"
  cache_size: 512 # per-text translation cache size (0 disables)
  translator_cache_size: 4 # max cached translator instances
  timeout_sec: 8.0 # translation timeout; set 0 for no timeout
  debounce_ms: 300 # delay before translating final text (0 disables)
  segment_max_chars: 160 # force-translate when buffer exceeds this (0 disables)
  segment_max_ms: 4000 # force-translate after this duration (0 disables)
  partial: false
  scheduler:
    global_max_concurrency: 8
    default_profile_max_concurrency: 4
  nllb:
    model: "facebook/nllb-200-distilled-600M"
  ollama:
    model: "gemma3:4b"
    host: "http://localhost:11434"
    keep_alive: "5m"
  openai:
    model: "gpt-5.3-codex-spark"
    api_key: ""
    base_url: "https://co.yes.vg/v1/chat/completions" # full endpoint or provider base URL
    api_type: "chat_completions" # chat_completions, responses, messages
    auto_complete_endpoint: true # false uses the entered URL without appending an endpoint
  vllm:
    active_profile: "local-default"
    profiles:
      - id: "local-default"
        name: "Local vLLM"
        mode: "local" # local runtime launch is managed by the desktop GUI, not this adapter
        base_url: "http://127.0.0.1:8000"
        api_key: ""
        model: ""
        served_model: ""
        api_type: "chat_completions"
        auto_complete_endpoint: true
        max_concurrency: 4
        runtime: # saved for a local launcher; the HTTP translation adapter does not apply it
          max_model_len: 4096
          max_num_seqs: 16
          tensor_parallel_size: 1
          gpu_memory_utilization: 0.9
          dtype: "auto"
          quantization: "auto"

subtitle:
  max_chars: 260
  max_sentences_default: 2
  max_sentences_cjk: 1
  max_repeat_sentences: 1
  history_lines: 2
  show_partial: true
